font-size:20px;font-weight:750}.roman{font-size:13px;color:var(--accent);margin-top:4px}.meaning{font-size:14px;margin-top:6px}.chargrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.char{background:var(--soft);border-radius:12px;text-align:center;padding:15px 5px}.char b{display:block;font-size:28px;font-weight:600}.char small{color:var(--muted)}.question{border:1px solid var(--border);border-radius:15px;padding:18px;margin:12px 0}.question h3{font-size:14px;margin:0 0 13px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.choice{background:var(--surface);border:1px solid var(--border);border-radius:11px;text-align:left;padding:11px}.choice.chosen{border-color:var(--accent);background:var(--soft)}.feedback{margin-top:12px;padding:10px 13px;border-radius:10px;background:var(--soft);font-size:13px}.field{border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:11px;width:100%;min-width:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.empty-note{padding:35px;text-align:center;color:var(--muted)}.notice{background:var(--notice);border-radius:13px;padding:14px;color:var(--notice-text);font-size:13px;line-height:1.7}.footer{color:var(--muted);font-size:12px;margin-top:36px;line-height:1.7}h1,h2,h3{line-height:1.4}h2{font-size:18px}h3{font-size:15px}p{line-height:1.65}@media(max-width:850px){.app{display:block}.side{display:none}.main{padding:23px 18px 90px}.title{font-size:21px}.hero{padding:22px}.hero .flower{font-size:52px}.cards{gap:8px}.stat{padding:15px}.stat strong{font-size:20px}.two{grid-template-columns:1fr}.grid-lesson{grid-template-columns:1fr}.calcell{min-height:57px;padding:6px;font-size:12px}.calcell span{font-size:9px}.chip{display:none}}@media(max-width:400px){.chargrid{gap:4px}.char b{font-size:25px}.choices{grid-template-columns:1fr}}

'use strict';
const row=(chars,rom,ko)=>[...chars].map((c,i)=>({j:c,r:rom[i],k:ko[i]}));
const rows=[row('あいうえお',['a','i','u','e','o'],['아','이','우','에','오']),row('かきくけこ',['ka','ki','ku','ke','ko'],['카','키','쿠','케','코']),row('さしすせそ',['sa','shi','su','se','so'],['사','시','스','세','소']),row('たちつてと',['ta','chi','tsu','te','to'],['타','치','츠','테','토']),row('なにぬねの',['na','ni','nu','ne','no'],['나','니','누','네','노']),row('はひふへほ',['ha','hi','fu','he','ho'],['하','히','후','헤','호']),row('まみむめも',['ma','mi','mu','me','mo'],['마','미','무','메','모']),row('やゆよ',['ya','yu','yo'],['야','유','요']),row('らりるれろ',['ra','ri','ru','re','ro'],['라','리','루','레','로']),row('わをん',['wa','wo','n'],['와','오','응'])];
const unit=[
{title:'일본어의 시작 · あ행',grammar:['わたしは がくせいです。','와타시와 가쿠세이데스','watashi wa gakusei desu','저는 학생입니다.','주제를 나타내는 조사 は는 wa로 읽어요.'],words:[['おはよう。','오하요','ohayou','좋은 아침!'],['ありがとう。','아리가토오','arigatou','고마워!'],['ごめんね。','고멘네','gomenne','미안해.']]},
{title:'か행 · 첫 인사',grammar:['こんにちは。','곤니치와','konnichiwa','안녕하세요.','인사말 끝의 は는 wa로 읽어요.'],words:[['かお','카오','kao','얼굴'],['かき','카키','kaki','감'],['こんばんは。','곤방와','konbanwa','안녕하세요(저녁).']]},
{title:'さ행 · 자기소개',grammar:['わたしは ○○です。','와타시와 ○○데스','watashi wa ○○ desu','저는 ○○입니다.','빈칸에 자신의 이름을 넣어보세요.'],words:[['すし','스시','sushi','초밥'],['あさ','아사','asa','아침'],['そうです。','소오데스','sou desu','그렇습니다.']]},
{title:'た행 · 부탁 표현',grammar:['ちょっと まって。','촛토 맛테','chotto matte','잠깐 기다려.','친한 사이에서 쓰는 부탁 표현이에요.'],words:[['たこ','타코','tako','문어'],['ちかてつ','치카테츠','chikatetsu','지하철'],['とけい','토케이','tokei','시계']]},
{title:'な행 · 일상 어휘',grammar:['なに？','나니','nani','뭐?','격식 없는 상황에서 묻는 말이에요.'],words:[['ねこ','네코','neko','고양이'],['いぬ','이누','inu','개'],['なつ','나츠','natsu','여름']]},
{title:'は행 · 긍정과 부정',grammar:['はい、そうです。','하이, 소오데스','hai, sou desu','네, 그렇습니다.','はい는 네, いいえ는 아니요예요.'],words:[['はな','하나','hana','꽃'],['ほし','호시','hoshi','별'],['いいえ','이이에','iie','아니요']]},
{title:'ま행 · 감정 말하기',grammar:['すきです。','스키데스','suki desu','좋아해요.','좋아하는 것을 말할 때 활용해요.'],words:[['みみ','미미','mimi','귀'],['まめ','마메','mame','콩'],['むし','무시','mushi','벌레']]},
{title:'や행 · 간단한 문장',grammar:['おやすみ。','오야스미','oyasumi','잘 자.','친한 사이에서 쓰는 취침 인사예요.'],words:[['やま','야마','yama','산'],['ゆき','유키','yuki','눈(날씨)'],['よる','요루','yoru','밤']]},
{title:'ら행 · 기초 어휘',grammar:['よろしく おねがいします。','요로시쿠 오네가이시마스','yoroshiku onegaishimasu','잘 부탁드립니다.','첫 만남이나 부탁을 할 때 자주 쓰는 표현이에요.'],words:[['そら','소라','sora','하늘'],['くるま','쿠루마','kuruma','자동차'],['さくら','사쿠라','sakura','벚꽃']]},
{title:'わ행·ん · 마무리',grammar:['わかりました。','와카리마시타','wakarimashita','알겠습니다.','상대방의 말을 이해했을 때 써요.'],words:[['わたし','와타시','watashi','저'],['ほん','혼','hon','책'],['にほん','니혼','nihon','일본']]},
];
const lessons=Array.from({length:30},(_,idx)=>{const u=unit[idx%10],cycle=Math.floor(idx/10);return {id:idx+1,title:idx<10?u.title:cycle===1?`${u.title} · 응용 복습`:`${u.title} · 실전 복습`,chars:rows[idx%10],grammar:u.grammar,words:u.words,review:idx>=10};});
const STORE='haruharu-japanese-v1';let state;try{state=JSON.parse(localStorage.getItem(STORE))||{}}catch{state={}};state.completed=state.completed||{};state.wrong=state.wrong||{};state.history=state.history||{};state.started=state.started||new Date().toISOString().slice(0,10);let tab='home',chosen=1,quizAnswers={},quizChecked=false,selectedDate=new Date().getDate(),viewMonth=new Date().getMonth(),viewYear=new Date().getFullYear();
const save=()=>StudySync.save(state);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const completedCount=()=>lessons.filter(l=>state.completed[l.id]).length;const nextLesson=()=>lessons.find(l=>!state.completed[l.id])?.id||30;const speak=t=>{if(!('speechSynthesis' in window)){alert('이 브라우저는 음성 재생을 지원하지 않아요.');return}speechSynthesis.cancel();let s=new SpeechSynthesisUtterance(t);s.lang='ja-JP';s.rate=.78;speechSynthesis.speak(s)};
function navbar(){return `<aside class="side"><div class="brand">🌸 하루하루 일본어</div>${[['home','⌂','대시보드'],['lessons','▤','전체 수업'],['calendar','▦','학습 캘린더'],['review','✎','복습 · 오답 노트'],['settings','⚙','데이터 관리']].map(x=>`<button class="nav ${tab===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</aside>`}
function layout(body){document.getElementById('app').innerHTML=`<div class="app">${navbar()}<main class="main"><header class="mobile-header"><button class="menu-toggle" onclick="openStudyMenu()" aria-label="메뉴 열기" aria-haspopup="dialog" aria-controls="mobile-menu" aria-expanded="false">☰</button><strong>🌸 하루하루 일본어</strong></header><div class="sync-banner"><span id="sync-status" role="status" aria-live="polite">기록 불러오는 중…</span> <button class="btn alt" onclick="go('settings')">계정 · 동기화</button></div>${body}<p class="footer">🌸 변경은 이 기기에 먼저 저장하고, 로그인하면 다른 기기와 자동 동기화해요.<br>음성은 브라우저의 일본어 음성 합성 기능을 사용하며 기기마다 다르게 들릴 수 있어요.</p></main></div><dialog id="mobile-menu" class="mobile-menu" aria-labelledby="mobile-menu-title" onclick="if(event.target===this)closeStudyMenu()" onclose="document.querySelector('.menu-toggle')?.setAttribute('aria-expanded','false')"><div class="top"><h2 id="mobile-menu-title">🌸 학습 메뉴</h2><button class="btn alt" onclick="closeStudyMenu()" aria-label="메뉴 닫기" autofocus>✕</button></div><nav aria-label="모바일 학습 메뉴">${[['home','⌂ 대시보드'],['lessons','▤ 전체 수업'],['calendar','▦ 학습 캘린더'],['review','✎ 복습 · 오답 노트'],['settings','⚙ 데이터 관리']].map(x=>`<button class="nav ${tab===x[0]?'active':''}" onclick="closeStudyMenu();go('${x[0]}')">${x[1]}</button>`).join('')}</nav></dialog>`;StudySync.paint()}
function head(t,sub){return `<div class="top"><div><h1 class="title">${t}</h1>${sub?`<div class="muted">${sub}</div>`:''}</div><span class="chip">5~10분씩 나눠 학습</span></div>`}
function lessonCard(l){let done=!!state.completed[l.id];return `<button class="lesson" onclick="openLesson(${l.id})"><span class="daytag">DAY ${String(l.id).padStart(2,'0')}</span><span class="status ${done?'done':''}">${done?'✓ 학습 완료':'자유 선택'}</span><h3>${esc(l.title)}</h3><p>${l.review?'기초 반복 ·':'히라가나 ·'} 어휘 · 회화 · 퀴즈</p></button>`}
function legacyHome(){let next=nextLesson();layout(`${head('일본어 학습','')}<div class="hero"><div><h2>오늘의 수업</h2><button class="btn" onclick="openLesson(${next})">DAY ${String(next).padStart(2,'0')} 수업 시작 →</button></div></div><div class="cards"><div class="stat"><small>완료 수업</small><strong>${completedCount()} <span style="font-size:14px">/ 30</span></strong><div class="progress"><div class="bar" style="width:${100*completedCount()/30}%"></div></div></div><div class="stat"><small>오늘의 목표</small><strong>25분</strong><small>학습 · 발음 · 복습</small></div><div class="stat"><small>다시 풀 문제</small><strong>${Object.keys(state.wrong).length}개</strong><small>오답 노트 자동 저장</small></div></div><div class="section-head"><h2>이어 공부하기</h2><button class="btn alt" onclick="go('lessons')">전체 수업 보기 →</button></div><div class="grid-lesson">${lessons.slice(Math.max(0,next-2),Math.min(30,next+2)).map(lessonCard).join('')}</div><div class="section-head"><h2>오답 복습</h2></div><div class="panel"><button class="btn alt" onclick="go('review')">오답 노트 · 단어 복습 →</button></div>`)}
function legacyLessons(){layout(`${head('전체 학습 커리큘럼','날짜 순서에 상관없이 선택할 수 있고, 완료한 수업도 눌러 다시 공부할 수 있어요.')}${[0,1,2].map((c)=>`<div class="section-head"><h2>${['1단계 · 히라가나와 기초 표현','2단계 · 기초 응용 반복','3단계 · 실전 반복 연습'][c]}</h2></div><div class="grid-lesson">${lessons.slice(c*10,c*10+10).map(lessonCard).join('')}</div>`).join('')}<p class="notice">30일 입문 코스입니다. 11~30일 차는 앞서 배운 문자를 응용·반복하는 수업으로, 고급 문법이나 가타카나 전체 과정은 아직 포함하지 않았어요.</p>`)}
function cal(){let first=new Date(viewYear,viewMonth,1).getDay(),last=new Date(viewYear,viewMonth+1,0).getDate(),today=new Date(),key=`${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(selectedDate).padStart(2,'0')}`,hist=state.history[key]||[],isToday=today.getFullYear()===viewYear&&today.getMonth()===viewMonth;layout(`${head('학습 캘린더 🗓','공부한 날짜를 기록하고 쉬었던 날의 수업도 자유롭게 선택하세요.')}<div class="panel"><div class="top"><button class="btn alt" onclick="month(-1)">← 이전 달</button><h2>${viewYear}년 ${viewMonth+1}월</h2><button class="btn alt" onclick="month(1)">다음 달 →</button></div><div class="calendar">${'일월화수목금토'.split('').map(d=>`<div class="weekday">${d}</div>`).join('')}${Array.from({length:first},()=>'<div class="calcell empty"></div>').join('')}${Array.from({length:last},(_,i)=>{let d=i+1,k=`${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,completed=state.history[k]||[];return `<button class="calcell ${selectedDate===d?'selected':''} ${isToday&&today.getDate()===d?'today':''}" onclick="pickDate(${d})">${d}<span>${completed.length?`✓ ${completed.length}수업`:''}</span></button>`}).join('')}</div></div><div class="section-head"><h2>${viewMonth+1}월 ${selectedDate}일</h2></div><div class="panel"><p>${hist.length?`이날 학습한 수업: ${hist.map(n=>lessonLabel(n)).join(', ')}`:'이날 학습 기록이 없어요. 빠진 날이어도 원하는 수업을 선택해서 공부하면 돼요.'}</p>${hist.map(n=>`<button class="btn alt" onclick="openAnyLesson('${n}')">${lessonLabel(n)} 다시 듣기</button>`).join(' ')} <button class="btn" onclick="go('lessons')">수업 골라 보충하기 →</button> <button class="btn alt" onclick="go('review')">복습하기</button></div>`)}
function term(t){return `<div class="term"><div style="flex:1"><div class="jap">${esc(t[0])}</div><div class="roman">${esc(t[1])} · ${esc(t[2])}</div><div class="meaning">${esc(t[3])}</div></div><button class="btn alt" onclick="say(${JSON.stringify(t[0]).replace(/"/g,'&quot;')})" aria-label="발음 듣기">🔊 듣기</button></div>`}
function makeQuestions(l){let arr=l.chars.slice(0,3).map((c,i)=>({id:`${l.id}-char-${i}`,q:`히라가나 '${c.j}'의 로마자는?`,a:[c.r,...l.chars.filter(x=>x.r!==c.r).slice(0,3).map(x=>x.r)].sort((a,b)=>a.localeCompare(b)),correct:c.r,ex:`${c.j} = ${c.r} (${c.k})`}));let w=l.words[0];arr.push({id:`${l.id}-word`,q:`'${w[0]}'의 뜻은?`,a:[w[3],...l.words.slice(1).map(x=>x[3]),l.grammar[3]].slice(0,4).sort((a,b)=>a.localeCompare(b)),correct:w[3],ex:`${w[0]} = ${w[3]}`});return arr}
function openLesson(n){chosen=n;tab='study';quizAnswers={};quizChecked=false;renderLesson()}
function renderLesson(){let l=lessons[chosen-1],qs=makeQuestions(l),completed=!!state.completed[chosen];layout(`${head(`DAY ${String(chosen).padStart(2,'0')} · ${esc(l.title)}`,'글자 읽기 → 어휘 듣기 → 문장 배우기 → 퀴즈와 입력 연습')}<div class="section-head"><h2>01. 오늘의 글자 · 8분</h2><span class="muted">히라가나</span></div><div class="panel"><p>각 글자를 소리 내어 읽고 종이에 세 번씩 써 보세요. 맨 아래는 일본어 키보드 입력용 로마자예요.</p><div class="chargrid">${l.chars.map(c=>`<div class="char"><b>${c.j}</b><small>${c.k}<br>${c.r}</small></div>`).join('')}</div><div class="actions"><button class="btn alt" onclick="say('${l.chars.map(c=>c.j).join('')}')">🔊 글자 듣기</button></div></div><div class="section-head"><h2>02. 단어 · 듣기 연습 · 7분</h2></div><div class="panel">${l.words.map(term).join('')}</div><div class="section-head"><h2>03. 오늘의 문장 · 5분</h2></div><div class="panel">${term(l.grammar)}<p class="notice">💡 ${esc(l.grammar[4])}</p></div><div class="section-head"><h2>04. 확인 퀴즈 · 5분</h2><span class="muted">틀린 문제는 오답 노트로!</span></div><div class="panel">${qs.map((q,i)=>`<div class="question"><h3>${i+1}. ${esc(q.q)}</h3><div class="choices">${q.a.map(a=>`<button class="choice ${quizAnswers[q.id]===a?'chosen':''}" onclick="choose('${q.id}',${JSON.stringify(a).replace(/"/g,'&quot;')})">${esc(a)}</button>`).join('')}</div>${quizChecked?`<div class="feedback">${quizAnswers[q.id]===q.correct?'✅ 정답!':'❌ 정답: '+esc(q.correct)} · ${esc(q.ex)}</div>`:''}</div>`).join('')}<button class="btn" onclick="grade()" ${qs.some(q=>!quizAnswers[q.id])?'disabled':''}>퀴즈 채점하기</button>${quizChecked?`<p class="muted">정답 ${qs.filter(q=>quizAnswers[q.id]===q.correct).length}/${qs.length}개 · 오답이 자동 기록됐어요.</p>`:''}</div><div class="section-head"><h2>05. 직접 타이핑</h2></div><div class="panel"><p>아래 일본어 표현을 로마자로 입력해 보세요. 공백과 문장부호는 생략해도 돼요.</p><div class="jap">${l.words[0][0]}</div><input class="field" id="typing" placeholder="로마자로 입력" autocomplete="off"><div class="actions"><button class="btn alt" onclick="checkTyping()">입력 확인</button></div><div id="typing-result" aria-live="polite"></div></div><div class="actions"><button class="btn" onclick="completeLesson()">${completed?'✓ 완료됨 · 다시 완료 기록':'오늘 수업 완료하기 ✓'}</button><button class="btn alt" onclick="go('lessons')">전체 수업</button>${chosen<30?`<button class="btn alt" onclick="openLesson(${chosen+1})">다음 수업 →</button>`:''}</div>`)}
function choose(id,a){quizAnswers[id]=a;quizChecked=false;renderLesson()}
function grade(){let l=lessons[chosen-1],qs=makeQuestions(l);if(qs.some(q=>!quizAnswers[q.id]))return;for(const q of qs){if(quizAnswers[q.id]!==q.correct)state.wrong[q.id]={...q,lesson:chosen};else delete state.wrong[q.id]}quizChecked=true;save();renderLesson()}
function checkTyping(){let l=lessons[chosen-1],typed=document.getElementById('typing').value.toLowerCase().replace(/[^a-z]/g,''),correct=l.words[0][2].toLowerCase().replace(/[^a-z]/g,'');document.getElementById('typing-result').innerHTML=`<p class="feedback">${typed===correct?'✅ 잘했어요!':'다시 도전해 봐요!'} 정답 입력: <b>${esc(l.words[0][2])}</b></p>`}
function completeLesson(){state.completed[chosen]=new Date().toISOString();let date=new Date(),k=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;state.history[k]=state.history[k]||[];if(!state.history[k].includes(chosen))state.history[k].push(chosen);save();alert(`DAY ${chosen} 학습 완료! 🌸`);go('home')}
function legacyReview(){let wrong=Object.values(state.wrong),done=lessons.filter(l=>state.completed[l.id]);layout(`${head('복습 · 오답 노트 ✍️','틀린 문항과 예전에 공부했던 단어를 다시 익혀요.')}<div class="section-head"><h2>내 오답 ${wrong.length}개</h2></div><div class="panel">${wrong.length?wrong.map(q=>`<div class="question"><h3>${esc(q.q)}</h3><p>정답: <strong>${esc(q.correct)}</strong> · ${esc(q.ex)}</p><button class="btn alt" onclick="clearWrong('${q.id}')">이 문제 외웠어요 ✓</button> <button class="btn alt" onclick="openAnyLesson('${q.lesson}')">DAY ${q.lesson} 다시 학습</button></div>`).join(''):'<div class="empty-note">아직 오답이 없어요! 수업 퀴즈를 풀어보세요 🌼</div>'}</div><div class="section-head"><h2>완료한 수업 다시 보기</h2></div><div class="grid-lesson">${done.length?done.map(lessonCard).join(''):'<div class="panel">수업을 완료하면 이곳에 모여요.</div>'}</div><div class="section-head"><h2>전체 단어 빠른 복습</h2></div><div class="panel">${(done.length?done:[lessons[0]]).flatMap(l=>l.words).map(term).join('')}</div>`)}
function clearWrong(id){delete state.wrong[id];save();review()}
function settings(){layout(`${head('학습 데이터 관리','계정 동기화와 JSON 백업으로 학습 기록을 관리해요.')}${StudyTheme.ui()}${StudySync.ui()}<div class="panel"><h2>내 학습 기록</h2><p>회화 완료 ${Object.keys(state.completed).filter(k=>k.startsWith('c')).length}/120 · 기존 기초 ${completedCount()}/30 · 오답 ${Object.keys(state.wrong).length}개</p><div class="actions"><button class="btn" onclick="exportData()">⬇ 학습 기록 JSON 백업</button><label class="btn alt" style="cursor:pointer">⬆ 백업 파일 복원<input type="file" accept="application/json,.json" style="display:none" onchange="importData(event)"></label><button class="btn alt" onclick="resetAll()">기록 전체 초기화</button></div><p class="notice">같은 이메일로 로그인하면 15초마다, 화면으로 돌아올 때, 기록이 바뀔 때 자동으로 동기화해요. 오프라인 변경은 연결이 돌아오면 전송해요. 백업 복원과 전체 초기화도 현재 계정에 동기화되니 먼저 JSON 백업을 권장해요.</p></div>`)}
function exportData(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='japanese-study-backup.json';a.click();URL.revokeObjectURL(url)}
function importData(e){const f=e.target.files?.[0];if(!f)return;if(f.size>1048576){alert('1MB 이하의 백업을 선택하세요.');return;}const reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!d.completed||!d.wrong||!d.history)throw Error('형식 오류');d=StudyCore.normalize(d);if(!confirm('현재 계정의 학습 기록을 이 백업으로 바꿀까요? 다른 기기에도 반영돼요.'))return;state=d;save();settings();alert('복원 완료!')}catch{alert('올바른 학습 백업 JSON 파일이 아니에요.')}};reader.readAsText(f)}
function resetAll(){if(confirm('현재 계정의 학습 기록을 모두 초기화할까요? 다른 기기에도 반영됩니다. 먼저 백업을 권장해요.')){state=StudyCore.normalize({});save();go('home')}}
function openStudyMenu(){document.querySelector('.menu-toggle').setAttribute('aria-expanded','true');document.getElementById('mobile-menu').showModal()}
function closeStudyMenu(){document.getElementById('mobile-menu')?.close()}
function lessonLabel(id){return String(id).startsWith('c')?'회화 '+String(id).slice(1):'기초 DAY '+id}
function openAnyLesson(id){if(String(id).startsWith('c'))StudyCourse.open(String(id));else openLesson(Number(id))}
function home(){StudyCourse.home()}
function allLessons(){StudyCourse.list()}
function review(){StudyCourse.review()}
function go(t){tab=t;({home,lessons:allLessons,calendar:cal,review,settings})[t]?.();window.scrollTo(0,0)}
function say(t){speak(t)}function month(delta){let d=new Date(viewYear,viewMonth+delta,1);viewYear=d.getFullYear();viewMonth=d.getMonth();selectedDate=1;cal()}function pickDate(d){selectedDate=d;cal()}
go('home');
StudySync.init({set(data){if(StudyCore.eq(state,data))return;state=data;({home,lessons:allLessons,calendar:cal,review,settings})[tab]?.();}});
if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
